version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: u_mini_cloud
      POSTGRES_PASSWORD: p_mini_cloud
      POSTGRES_DB: mini_cloud_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
